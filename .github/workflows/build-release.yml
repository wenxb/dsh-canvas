# Build the plugin and attach the packed tarball to a GitHub Release.
#
# The plugin's devDependencies are `link:` into a local deepseek-harness
# checkout (the plugin repo's build-time dependency source), so this workflow
# checks out that harness and builds it before building the plugin. The harness
# ref is PINNED to the rc.5-era commit the plugin's source targets (the same
# commit dsh-diff-viewer pins): harness master moves, and a pinned build keeps
# releases reproducible.
#
# Triggered on release publish (attach to that release) or manually.
name: build-release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the tarball to (defaults to the latest release)'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          # The plugin's devDependencies are `link:../dsh2026/...` relative to
          # the plugin root; check it into a named subdir so that relative
          # target lands on the harness checkout below (GITHUB_WORKSPACE itself
          # already carries the repo name, so a root checkout would shift the
          # link target one level too high).
          path: dsh-canvas

      - name: Checkout deepseek-harness (plugin build-time dependency source)
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          # dsh-v0.1.5-rc.2 (tag → commit fb2c4b9e) — the DSH the plugin's source
          # actually targets: its devDependencies resolve against `dsh@0.1.5-rc.2` on
          # the author's machine. The previous pin (47f9438) PREDATES two packages the
          # client half imports, `@deepseek-ai/dsh-api-session-controller` and
          # `@deepseek-ai/dsh-client-ui-chat`, so no install could ever resolve. The ref
          # is a commit rather than the tag, so the build stays reproducible.
          ref: fb2c4b9e698e30edb738bca4cf0618587db7d203
          path: dsh2026/deepseek-harness
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # Match the harness's declared packageManager (pnpm@11.7.0): pnpm 10
          # installs a different public-hoist layout, which breaks resolution
          # from the linked harness sources during the plugin tests.
          version: 11.7.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dsh2026/deepseek-harness/pnpm-lock.yaml

      - name: Build harness (tsc emits lib/types, tsdown emits lib runtimes)
        working-directory: dsh2026/deepseek-harness
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:lib

      - name: 'Repoint the devDependencies at the checked-out harness'
        working-directory: dsh-canvas
        run: |
          # WHY THIS EXISTS: the committed package.json links every @deepseek-ai/*
          # devDependency at an ABSOLUTE path inside the author's machine
          # ($HOME/.nvm/versions/node/*/lib/node_modules/@deepseek-ai/dsh/node_modules/…),
          # and pnpm-lock.yaml records those same specifiers — so a runner died with
          #   ENOENT …/@deepseek-ai/cordis  (exit 254)
          # before it ever reached a build. Each absolute link is repointed at the
          # package of the SAME NAME inside the harness checkout above, located by
          # SCANNING its package.json files: no path table to rot when the harness
          # moves a package, and a genuinely missing package fails loudly here instead
          # of silently shipping a broken build. (`file:./stubs/…` links are relative
          # already — portable, therefore untouched.)
          node -e '
            const fs = require("fs"), path = require("path")
            const HARNESS = "../dsh2026/deepseek-harness"
            const byName = new Map()
            const walk = (dir) => {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                if (entry.name === "node_modules" || entry.name === ".git") continue
                const full = path.join(dir, entry.name)
                if (entry.isDirectory()) { walk(full); continue }
                if (entry.name !== "package.json") continue
                try {
                  const name = JSON.parse(fs.readFileSync(full, "utf8")).name
                  if (typeof name === "string" && !byName.has(name)) byName.set(name, path.dirname(full))
                } catch {}
              }
            }
            walk(HARNESS)
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"))
            const dev = pkg.devDependencies ?? {}
            const moved = []
            for (const [name, spec] of Object.entries(dev)) {
              if (typeof spec !== "string" || !spec.startsWith("file:/")) continue
              const dir = byName.get(name)
              if (dir === undefined) {
                throw new Error("the harness checkout at the pinned ref has no package named " + name + " (spec: " + spec + ") — bump the ref instead of stubbing it")
              }
              dev[name] = "link:" + path.relative(process.cwd(), dir).split(path.sep).join("/")
              moved.push(name)
            }
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n")
            console.log("repointed " + moved.length + " absolute link(s):", moved.join(", "))
          '

      - name: 'Install plugin (link: targets now exist)'
        working-directory: dsh-canvas
        # --no-frozen-lockfile: the lock still records the ABSOLUTE specifiers that
        # were just rewritten, so a frozen install would reject the fixed manifest.
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck, test, build
        working-directory: dsh-canvas
        run: pnpm run check

      - name: Pack release tarball
        working-directory: dsh-canvas
        run: |
          # The devDependencies are link: into the harness checkout; strip them
          # from the packed manifest (npm pack reads the working package.json)
          # so a plain consumer install never tries to resolve those links.
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));delete p.devDependencies;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          mkdir -p dist
          npm pack --pack-destination dist
          # Rename to a versionless fixed name so
          # releases/latest/download/dsh-external-dsh-canvas.tgz always
          # points at the newest build.
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));const fixed=p.name.replace(/^@/,'').replace('/','-')+'.tgz';const packed=fs.readdirSync('dist').find(f=>f.endsWith('.tgz'));if(packed&&packed!==fixed){fs.renameSync('dist/'+packed,'dist/'+fixed)}"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: dsh-canvas
        run: |
          # Release-publish runs attach to that release; a manual dispatch
          # attaches to the latest release unless a tag input is given.
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(gh release view --json tagName --jq .tagName)
          fi
          gh release upload "$TAG" dist/*.tgz --clobber
